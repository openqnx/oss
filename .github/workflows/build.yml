name: build

# Requires a self-hosted runner with QNX SDP 8.0 installed and licensed at
# $QNX_SDP_ROOT. Never runs on GitHub-hosted runners -- they have no SDP.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Components to build (space separated, or 'all')"
        required: true
        default: "zlib"
      arch:
        description: "aarch64le, x86_64, or both"
        required: true
        default: "both"

jobs:
  build:
    runs-on: [self-hosted, qnx-sdp]
    steps:
      # The maintainer's workspace ($OSS_WS, from the runner's .env): the
      # dependencies' staging trees live there, not in a fresh checkout.
      - name: Workspace up to date with main
        run: cd "$OSS_WS" && git fetch -q origin main && git merge --ff-only origin/main
      - name: Build
        env:
          PACKAGES: ${{ inputs.packages }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -e
          cd "$OSS_WS"
          pkgs="$PACKAGES"
          [ "$pkgs" = "all" ] && pkgs="$(ls ports)"
          case "$ARCH" in
            both) ./scripts/qnxbuild $pkgs ;;
            *)    ./scripts/qnxbuild -a "$ARCH" $pkgs ;;
          esac
      - name: Audit the staging tree
        run: cd "$OSS_WS" && ./scripts/check-all
