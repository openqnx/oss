# clang on QNX (native-toolchain): QNX's headers, start files and link
# libraries are in <prefix>/qnx-sysroot, copied from the user's SDP by
# scripts/target-sysroot. <CFGDIR> is this file's directory (<prefix>/bin).
--sysroot=<CFGDIR>/../qnx-sysroot
# QNX's crtn.o has no .note.GNU-stack section; GNU ld would warn on every
# link that it implies an executable stack.
-Wl,-z,noexecstack
# GNU ld resolves the libraries a shared library needs (to check for undefined
# symbols) outside the -L directories: name where QNX's and the packages' are.
-Wl,-rpath-link,<CFGDIR>/../qnx-sysroot/usr/lib
-Wl,-rpath-link,<CFGDIR>/../lib
# The packages' own headers and libraries (<prefix>/include, <prefix>/lib) are
# system directories, searched before QNX's: pkg-config leaves them out of
# --cflags/--libs as such, and where the SDP has an older copy of a library
# that is also a package (zlib, OpenSSL, ...), header and library must both
# be the package's.
-isystem <CFGDIR>/../include
-L<CFGDIR>/../lib
