## QNX Neutrino 8.0 targets for OpenSSL.
## Upstream ships no QNX target; this adds one per architecture, driving qcc.
## Notes:
##  - sockets live in libsocket, not libc
##  - _QNX_SOURCE is required or the POSIX declarations stay hidden under -std=c*
##  - librt/libdl/libpthread do not exist; pthreads and dlopen are inside libc
##  - the cross-GCC driver is used rather than qcc: qcc misparses OpenSSL's
##    "-MMD -MF <file> -c -o <obj> <src>" as multiple input files and aborts
##    with "Can't specify -P, -C, -E, -c or -S with -o and have multiple files"
my %targets = (
    "qnx-generic" => {
        inherit_from     => [ "BASE_unix" ],
        template         => 1,
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O3"),
        cflags           => add("-D_QNX_SOURCE"),
        cppflags         => "",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        shared_target    => "gnu-shared",
        shared_cflag     => "-fPIC",
        shared_ldflag    => "-shared",
        ex_libs          => add("-lsocket"),
        perl_platform    => 'Unix',
    },
    "qnx-aarch64le" => {
        inherit_from     => [ "qnx-generic" ],
        CC               => "aarch64-unknown-nto-qnx8.0.0-gcc",
        CXX              => "aarch64-unknown-nto-qnx8.0.0-g++",
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
    },
    "qnx-x86_64" => {
        inherit_from     => [ "qnx-generic" ],
        CC               => "x86_64-pc-nto-qnx8.0.0-gcc",
        CXX              => "x86_64-pc-nto-qnx8.0.0-g++",
        lib_cppflags     => add("-DL_ENDIAN"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
    },
);
