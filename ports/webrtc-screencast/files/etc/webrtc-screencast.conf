# Options of webrtc-screencast when the desktop session starts it, on one
# line (webrtc-screencast --help lists them). --input lets the browser's
# mouse and keyboard work the desktop: leave it out for view only. Anyone who
# reaches the port can watch (and with --input, use the desktop) unless a
# token is set:
#   --port 8080 --fps 15 --input --token my-secret
#       then only http://<address>:8080/?token=my-secret is let in
--port 8080 --fps 15 --input
